<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{title}}</title>
</head>
<body>
{% set user_list = ['Tom','Tim','Bob','Bill']%}

<h1>в очереди:</h1>
<ul>
    {% for user in user_list%}
    <li>{{loop.index}}- {{user}}
    {% if loop.first %}
    первый в очереди
    {%elif loop.last%}
    последний в очереди
    {%endif%}</li>
{%endfor%}
</ul>
</body>
</html>
